  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de IMC</title>
  </head>
  <body>
      <section id="formImc">
      <h1>Calculadora de IMC</h1>

    <form id="seuImc">
        <label for="peso">Informe seu peso</label>
    <input type="number" id="peso" step="any"> <!-- step="any" serve para pode colocar valores decimais -->

     <label for="altura">Informe sua altura</label>
    <input type="number" id="altura" step="any">

     <button type="button" id="enviarImc">Enviar</button>
      <button type="button" id="resetImc">Reset</button>
     </form>

    </section>

      <p id="resultadoImc"></p>

      <script src="script.js"></script>
    
  </body>
  </html>
